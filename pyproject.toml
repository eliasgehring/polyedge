[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyedge"
version = "0.1.0"
description = "Truth-preserving prediction-market probability research engine."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
dashboard = [
    "streamlit==1.50.0",
    "pandas>=2,<3",
    "altair>=5,<6",
]

[project.scripts]
polyedge = "polyedge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
